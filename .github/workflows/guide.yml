# The book moved to Lovemore-Gakava/usdm-acdc-guide on 2026-11-03 (docs/decisions.md).
#
# This repository's Pages site stays up only to send the old address to the new
# one, chapter by chapter: the file names did not change, so a link made while
# the book was published from here still lands on the same chapter. Nothing is
# rendered here any more; the book's own repository checks, builds and deploys it.

name: guide

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/guide.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write the redirect
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>Protocol to result has moved</title>
          <link rel="canonical" href="https://lovemore-gakava.github.io/usdm-acdc-guide/">
          <meta http-equiv="refresh" content="0; url=https://lovemore-gakava.github.io/usdm-acdc-guide/">
          <script>
            var rest = location.pathname.replace(/^\/usdm-acdc-in-practice\/?/, "");
            location.replace("https://lovemore-gakava.github.io/usdm-acdc-guide/" + rest + location.search + location.hash);
          </script>
          </head>
          <body>
          <p>The book has moved to
          <a href="https://lovemore-gakava.github.io/usdm-acdc-guide/">lovemore-gakava.github.io/usdm-acdc-guide</a>.</p>
          </body>
          </html>
          HTML
          cp site/index.html site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
